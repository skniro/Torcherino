plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
    id 'idea'
}

base.archivesName = "${mod_name}-fabric-${minecraft_version}-unofficial"

def fabricParentJar = project(':Fabric').tasks.named('jar')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly project(path: ':Fabric', configuration: 'parentOutput')
    // Bundle the official mod inside the unofficial jar (Jar-in-Jar).
    include project(':Fabric')
    // Load the official mod in the development runs.
    localRuntime files(fabricParentJar)
}

loom {
    runs {
        FabricUnofficialClient {
            client()
            setConfigName("Fabric Unofficial Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        FabricUnofficialServer {
            server()
            setConfigName("Fabric Unofficial Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId "${mod_name}-fabric-${minecraft_version}-unofficial"
            version project.version
            from components.java
        }
    }

    repositories {
        if (System.getenv("MAVEN_URL")) {
            maven {
                name = 'mavenLocal2'
                url System.getenv("MAVEN_URL")
            }
        }
    }
}
