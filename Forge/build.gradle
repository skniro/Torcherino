plugins {
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.+'
    // ForgeGradle 7 requires this plugin for legacy (1.20.4 and older) reobfuscation.
    id 'net.minecraftforge.renamer' version '1.1.8'
}

base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

// Exposes the compiled classes to the unofficial addon for compile-time access
// without pulling the full mod into its runtime classpath.
def parentClassesJar = tasks.register('parentClassesJar', Jar) {
    from(sourceSets.main.output)
    archiveClassifier = 'classes'
    destinationDirectory = layout.buildDirectory.dir('internal')
}

configurations {
    parentOutput {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    parentOutput parentClassesJar
}

// Forge 1.20.2's userdev launch handler only discovers development mods through
// the MOD_CLASSES environment variable (ClasspathLocator ignores directories).
// ForgeGradle 7 never sets it, so without this the project's own classes and
// resources are not loaded in the dev runs. Entries use the "modid%%path" form.
def devModClasses = ([sourceSets.main.output.resourcesDir] + sourceSets.main.output.classesDirs.files)
        .findAll { it != null }
        .collect { "${mod_id}%%${it.absolutePath}" }
        .join(File.pathSeparator)

minecraft {
    mappings channel: 'official', version: minecraft_version

    if (project.hasProperty('forge_ats_enabled') && project.findProperty('forge_ats_enabled').toBoolean()) {
        accessTransformer = true
        project.logger.debug('Forge Access Transformers are enabled for this project.')
    }

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            environment 'MOD_CLASSES', devModClasses
        }

        register('forgeClient') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('forgeServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('forgeData') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

tasks.matching { it.name.startsWith('slimeLauncherMetadataFor') }.configureEach { metadataTask ->
    def runsJsonFile = metadataTask.outputs.files.files.find { it.name == 'runs.json' }

    doLast {
        def json = new groovy.json.JsonSlurper().parse(runsJsonFile, 'UTF-8')
        def aliases = [:]
        ['client', 'server', 'data', 'gameTestServer'].each { runName ->
            def config = json[runName]
            if (config instanceof Map)
                aliases["forge${runName.capitalize()}"] = new LinkedHashMap(config)
        }
        json.putAll(aliases)
        runsJsonFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly project(":Common")
}

// Renamer Gradle provides the SRG-renamed production jar for legacy (pre-1.20.5) Forge.
renamer.mappings.from minecraft.dependency.toSrgFile

renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = 'srg'
}

tasks.withType(JavaCompile).configureEach {
    source(project(":Common").sourceSets.main.allSource)
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    // Gradle 9 fails the build on duplicate resources (e.g. the mod icon exists
    // in both this module and Common).
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":Common").sourceSets.main.resources

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range, mod_id: mod_id,
            mod_name: mod_name, mod_license: mod_license, mod_version: project.version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.property('replaceProperties', replaceProperties)

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId base.archivesName.get()
            version project.version
            // The dev jar cannot run in production; publish the SRG-renamed jar as well.
            artifact jar
            artifact renameJar
        }
    }
    repositories {
        if (System.getenv("MAVEN_URL")) {
            maven {
                name = 'mavenLocal2'
                url System.getenv("MAVEN_URL")
                // Add repositories to publish to here.
                // Notice: This block does NOT have the same function as the block in the top level.
                // The repositories here will be used for publishing your artifact, not for
                // retrieving dependencies.
            }
        }
    }
}
